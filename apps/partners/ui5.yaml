specVersion: "3.0"
metadata:
  name: com.meridian.partners
type: application
framework:
  name: SAPUI5
  version: "1.120.20"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.suite.ui.generic.template
    - name: sap.f
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: sap-fe-mockserver
      mountPath: /
      afterMiddleware: compression
      configuration:
        services:
          - urlPath: /sap/opu/odata/sap/ZBP_PARTNER_SRV
            metadataPath: ../../mock/metadata.xml
            mockdataPath: ../../mock
            generateMockData: true
