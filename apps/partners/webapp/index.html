<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
	<title>Business Partners - Meridian</title>

	<!-- 1.71.x / sap_belize, but still SYNCHRONOUS bootstrap. Migration X-03. -->
	<script
		id="sap-ui-bootstrap"
		src="https://openui5.hana.ondemand.com/1.71.69/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_belize"
		data-sap-ui-libs="sap.m,sap.ui.layout"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="false"
		data-sap-ui-resourceroots='{
			"com.meridian.partners": "./",
			"com.meridian.lib.reuse": "../../../shared/com/meridian/lib/reuse"
		}'>
	</script>

	<script>
		sap.ui.getCore().attachInit(function () {
			new sap.m.Shell({
				app: new sap.ui.core.ComponentContainer({
					height: "100%",
					name: "com.meridian.partners"
				})
			}).placeAt("content");
		});
	</script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
