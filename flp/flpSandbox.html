<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Meridian Launchpad</title>

	<!-- "Poor man's" custom launchpad shell page for local navigation. After the Fiori elements
	     migration all apps run on a single unified runtime (SAPUI5 1.120, theme sap_horizon) and
	     each tile opens that app's local dev server (started via `npm run start:<app>`). -->
	<script
		id="sap-ui-bootstrap"
		src="https://sapui5.hana.ondemand.com/1.120.0/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-libs="sap.m,sap.f,sap.ui.layout"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true">
	</script>

	<style>
		html, body { height: 100%; margin: 0; }
		.meridianLaunchpadBg { background: #f7f7f7; }
		.meridianGroupTitle { font-size: 1.25rem; font-weight: 300; margin: 1rem 1rem 0.25rem 1.5rem; color: #32363a; }
	</style>

	<script>
		// Explicit module imports keep the launchpad robust under async bootstrap on UI5 1.120
		// (the legacy sap.f.* / sap.m.* globals are not guaranteed to be populated synchronously).
		sap.ui.require([
			"sap/ui/core/Core",
			"sap/f/GridContainer",
			"sap/f/GridContainerSettings",
			"sap/m/GenericTile",
			"sap/m/TileContent",
			"sap/m/ImageContent",
			"sap/m/Page",
			"sap/m/Bar",
			"sap/m/Title",
			"sap/m/App",
			"sap/ui/core/HTML"
		], function (Core, GridContainer, GridContainerSettings, GenericTile, TileContent, ImageContent, Page, Bar, Title, App, HTML) {
			"use strict";

			Core.ready(function () {

				var aTiles = [
					{ title: "Sales Orders", subtitle: "UI5 1.120 · sap_horizon", info: "ZSD_SALESORDER_SRV", icon: "sap-icon://sales-order", url: "http://localhost:8081/index.html" },
					{ title: "Purchase Approvals", subtitle: "UI5 1.120 · sap_horizon", info: "ZMM_APPROVAL_SRV", icon: "sap-icon://approvals", url: "http://localhost:8083/index.html" },
					{ title: "Material Master", subtitle: "UI5 1.120 · sap_horizon", info: "ZMM_MATERIAL_SRV", icon: "sap-icon://product", url: "http://localhost:8084/index.html" },
					{ title: "Business Partners", subtitle: "UI5 1.120 · sap_horizon", info: "ZBP_PARTNER_SRV", icon: "sap-icon://customer", url: "http://localhost:8082/index.html" }
				];

				var oGrid = new GridContainer({
					snapToRow: true,
					layout: new GridContainerSettings({ rowSize: "11rem", columnSize: "11rem", gap: "0.75rem" })
				});

				aTiles.forEach(function (oDef) {
					oGrid.addItem(new GenericTile({
						header: oDef.title,
						subheader: oDef.subtitle,
						press: function () { window.location.href = oDef.url; },
						tileContent: [
							new TileContent({
								footer: oDef.info,
								content: new ImageContent({ src: oDef.icon })
							})
						]
					}).addStyleClass("sapUiTinyMargin"));
				});

				var oPage = new Page({
					showHeader: true,
					customHeader: new Bar({
						contentMiddle: [ new Title({ text: "Meridian Manufacturing — Home" }) ]
					}),
					content: [ oGrid ]
				}).addStyleClass("meridianLaunchpadBg");

				oPage.insertContent(new HTML({ content: "<div class='meridianGroupTitle'>My Apps</div>" }), 0);

				new App({ pages: [ oPage ] }).placeAt("content");
			});
		});
	</script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
